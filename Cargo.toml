[package]
name = "jluszcz_rust_utils"
authors = ["Jacob Luszcz"]
version = "0.1.0"
edition = "2024"
description = "Common utilities for Jacob Luszcz's Rust Lambdas: logging setup, an HTTP GET helper with retry, and a simple file-based cache."
license = "MIT"
repository = "https://github.com/jluszcz/rust-utils"

[build-dependencies]
rustc_version = "0.4"

[features]
query = ["dep:backon", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:tokio"]
cli = ["dep:clap"]
aws = ["dep:aws-config"]
bedrock = ["aws", "dep:aws-sdk-bedrockruntime", "tokio/time"]
tls = ["dep:rustls", "rustls/aws_lc_rs"]
tls-ring = ["dep:rustls", "rustls/ring"]
lambda = ["tls", "dep:lambda_runtime", "dep:serde"]

[dependencies]
anyhow = "1"
chrono = "0.4"
fern = "0.7"
log = "0.4"
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }
# `default` pulls in the `rustls` feature, which is the legacy hyper-0.14 client stack
# (rustls 0.21 / rustls-webpki 0.101) that nothing here uses and that no longer receives
# security fixes. `default-https-client` is the modern rustls 0.23 path the SDK actually calls.
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"], optional = true }
backon  = { version = "1",    optional = true }
clap    = { version = "4",    features = ["derive"], optional = true }
lambda_runtime = { version = "1", optional = true }
rustls  = { version = "0.23", default-features = false, optional = true }
# `default` resolves to `default-tls` -> `rustls` -> `__rustls-aws-lc-rs`, which
# pins aws-lc-rs on every consumer of `query`. `rustls-no-provider` is the same
# TLS stack with the choice left to the application, which is what lets a
# non-Lambda consumer stay on ring. The three features below `rustls-no-provider`
# were in reqwest's own `default` set and are carried over by name.
reqwest = { version = "0.13", default-features = false, features = [
    "gzip", "json", "query", "rustls-no-provider", "http2", "charset", "system-proxy",
], optional = true }
serde   = { version = "1",    features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio   = { version = "1",    features = ["fs"], optional = true }

[dev-dependencies]
# Only for constructing a deliberately-failing credentials provider in the
# bedrock tests; already in the tree transitively via aws-config.
aws-credential-types = { version = "1", features = ["test-util"] }
# reqwest's `rustls-no-provider` build panics when a `Client` is built with no
# process-wide provider installed. The library leaves that choice to the
# application; the test suite makes it here, for the case where neither `tls`
# nor `tls-ring` is enabled and there is otherwise no provider to install.
# Dev-dependencies do not reach consumers, so this pins nothing for them.
#
# It does mean dev-dependency feature unification compiles `aws-lc-sys` into
# every test build, `--features tls-ring` included, so `cargo test` never sees
# a ring-only graph and building the tests wants CMake. `cargo build`, which
# takes no dev-dependencies, is what covers ring alone; CI's `features` job
# runs both.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
